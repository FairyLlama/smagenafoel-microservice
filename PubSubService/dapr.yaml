version: 1
common:
  resourcesPath: ./.dapr/components/
apps:
  - appID: InventoryService
    appDirPath: ./src/InventoryService/
    appPort: 8081
    command: ["dotnet", "run"]
  - appID: OrderService
    appDirPath: ./src/OrderService/
    appPort: 8080
    command: ["dotnet", "run"]
  - appID: TicketService
    appDirPath: ./src/TicketService/
    appPort: 8082
    command: ["dotnet", "run"]
  - appID: TicketOrderService
    appDirPath: ./src/TicketOrderService/
    appPort: 8083
    command: ["dotnet", "run"]
