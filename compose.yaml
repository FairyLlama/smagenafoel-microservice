services:
  database:
    image: postgres:18
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: oel_db
    volumes:
      - oel_data:/var/lib/postgresql

