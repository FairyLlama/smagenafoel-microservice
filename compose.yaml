services:
  auth:
    build: ./AuthenticationService
    ports:
      - 8081:8081
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8081
      - Jwt__Key=very_super_secret_key_from_docker
      - Jwt__Issuer=SmagenAfOelAuth
      - Jwt__Audience=SmagenAfOelClient
